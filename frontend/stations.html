<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Helix — Stations</title>
  <link rel="stylesheet" href="assets/css/app.css" />
</head>

<body>
  <div class="topbar pandoraTop">
    <div class="navLeft">
      <a class="navLink" href="index.html" data-nav="now">Now Playing</a>
      <a class="navLink" href="my-collection.html" data-nav="collection">My Collection</a>
      <a class="navLink" href="browse.html" data-nav="browse">Browse</a>
      <a class="navLink" href="listening-history.html" data-nav="history">Listening History</a>
      <a class="navLink" href="stations.html" data-nav="stations">Stations</a>
      <a class="navLink" href="liked-songs.html" data-nav="liked">Liked Songs</a>
    </div>

    <div class="topSearch">
      <input id="globalSearch" type="text" placeholder="Search" />
    </div>

    <div class="navRight">
      <a href="admin.html" id="adminLink" style="display:none;">Admin</a>
      <a href="#" id="logoutLink">Logout</a>
      <span class="status" id="whoami"></span>
    </div>
  </div>
  <main class="shell">
    <!-- Force vertical layout regardless of global CSS -->
    <div id="stationsPageStack" style="display:flex; flex-direction:column; gap:18px; width:100%;">

      <section class="pageHeader" style="width:100%; display:block;">
        <h1>Stations</h1>
        <div class="muted">Your stations are personal and evolve as you like/dislike and skip.</div>
      </section>

<!-- CREATE STATION -->
<section class="card" style="padding:18px; width:100%; display:block;">

  <!-- ROW 1 -->
  <div style="display:flex; gap:16px; flex-wrap:wrap;">

    <div style="flex:0 0 220px; min-width:200px;">
      <div class="muted" style="margin-bottom:6px;">Seed type</div>
      <select id="stSeedType" class="input" style="width:100%;">
        <option value="artist">Artist</option>
        <option value="track">Track</option>
      </select>
    </div>

    <div style="flex:1 1 400px; min-width:260px;">
      <div class="muted" style="margin-bottom:6px;">Station name</div>
      <input
        id="stName"
        class="input"
        type="text"
        placeholder="e.g., Indie Rock Radio"
        style="width:100%;"
      />
    </div>

  </div>

  <!-- ROW 2 -->
  <div style="margin-top:16px;">
    <div class="muted" style="margin-bottom:6px;">Seed artist</div>
    <input
      id="stArtist"
      class="input"
      type="text"
      placeholder="e.g., Lord Huron"
      style="width:100%;"
    />
  </div>

  <!-- Track title (only visible when seed type = track) -->
  <div id="stTitleWrap" style="margin-top:16px; display:none;">
    <div class="muted" style="margin-bottom:6px;">Seed track title</div>
    <input
      id="stTitle"
      class="input"
      type="text"
      placeholder="e.g., Bag of Bones"
      style="width:100%;"
    />
  </div>

  <!-- Buttons -->
  <div style="margin-top:18px; display:flex; gap:12px; justify-content:flex-end;">
    <button id="stUseNow" class="btn" type="button">
      Use now playing
    </button>
    <button id="stCreate" class="primaryBtn" type="button">
      Create
    </button>
  </div>

  <div id="stCreateStatus" class="muted" style="margin-top:10px;"></div>
</section>

      <!-- YOUR STATIONS (now guaranteed below creation UI) -->
      <section id="yourStationsSection" style="width:100%; display:block;">
        <h2 style="margin:0 0 12px;">Your Stations</h2>
        <div id="stationsList" class="resultsList"></div>
      </section>

    </div>
  </main>
<div class="playerBar" role="region" aria-label="Player">
    <div class="playerRow">
      <div class="playerLeft">
        <img id="pbThumb" class="pbThumb" alt="Cover" loading="lazy" />
        <div class="pbText">
          <div class="pbTitle" id="pbTitle">—</div>
          <div class="pbSub" id="pbSub">—</div>
        </div>
      </div>
      <div class="playerCenter">
        <button class="iconBtn" id="pbReplay" title="Replay" type="button"></button>
        <button class="iconBtn" id="pbPrev" title="Previous" type="button">⏮</button>
        <button class="iconBtn play" id="pbPlay" title="Play/Pause" type="button">▶</button>
        <button class="iconBtn" id="pbNext" title="Next" type="button">⏭</button>
        <div class="pbVolume" aria-label="Volume">
          <button class="iconBtn" id="pbVolIcon" title="Volume" type="button">🔊</button>
          <input class="pbVol" id="pbVol" type="range" min="0" max="100" value="100" step="1" aria-label="Volume slider" />
        </div>
        <button class="iconBtn" id="pbLike" title="Like" type="button"></button>
        <button class="iconBtn" id="pbDislike" title="Dislike" type="button">👎</button>
        <button class="iconBtn" title="Shuffle" type="button" disabled>🔀</button>
      </div>
      <div class="playerRight">
        <div class="muted" id="pbMeta"></div>
      </div>
    </div>

    <div class="playerProgress" aria-label="Progress">
      <div class="pbTime" id="pbCur">0:00</div>
      <div class="pbTrack" id="pbTrack" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
        <canvas id="pbWave" class="pbWave" height="28"></canvas>
      </div>
      <div class="pbTime" id="pbDur">0:00</div>
    </div>
  </div>
  <script type="module" src="assets/js/router.js"></script>
</body>
</html>
