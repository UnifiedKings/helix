<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Helix — Login</title>
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">Helix</div>
    <div class="nav">
      <a href="index.html">Search</a>
    </div>
  </div>

  <div class="authCard">
    <h2 id="modeTitle">Sign in</h2>
    <div class="small" id="modeHint">Enter your username and password.</div>

    <div class="row" style="margin-top:12px;">
      <input id="username" type="text" placeholder="Username" style="flex:1; min-width:200px;" />
      <input id="password" type="password" placeholder="Password" style="flex:1; min-width:200px;" />
      <button id="submitBtn">Submit</button>
    </div>

    <div class="status" id="status" style="margin-top:10px;"></div>
  </div>

  <script type="module" src="assets/js/login.js"></script>
</body>
</html>
