<div class="Page PageArtist">
<main class="shell shellArtist">
    <section class="artistHero" id="artistHero">
      <div class="artistHeroBg" id="artistHeroBg"></div>
      <div class="artistHeroInner">
        <div class="artistHeroTitle" id="artistName">Artist</div>
        <div class="artistHeroSub muted" id="artistMeta"></div>
        <div class="artistHeroActions">
          <button class="pillBtn" id="artistPlayBtn">▶ Top Songs</button>
        </div>
      </div>
    </section>

    <section class="artistGrid">
      <div class="artistLeft">
        <div class="artistPortraitWrap">
          <img id="artistPortrait" class="artistPortrait" alt="Artist" loading="lazy" />
        </div>
      </div>

      <div class="artistRight">
        <div class="artistSection">
          <div class="artistSectionHeader">
            <h2>Top Songs</h2>
          </div>
          <div class="artistTrackList" id="artistTopSongs"></div>
        </div>

        <div class="artistSection" style="margin-top: 28px;">
          <div class="artistSectionHeader">
            <h2>Top Albums</h2>
          </div>
          <div class="albumRow" id="artistTopAlbums"></div>
        </div>
      </div>
    </section>
  </main>

</div>
