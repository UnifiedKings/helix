<div class="Page PageListeningHistory">
<main class="shell">
  <section class="panel" style="width:100%;">
    <div class="pageHeader">
      <h1>Listening History</h1>
      <p class="muted">Recently played and skipped tracks.</p>
    </div>

    <div class="historyLayout">
      <div class="historyCol">
        <div id="historyList" class="list"></div>
        <div id="historyEmpty" class="muted" style="display:none; padding: 12px 0;">No listening history yet.</div>
      </div>
      <aside class="historyDetail" id="historyDetail" aria-label="History details">
        <div class="muted" style="padding: 8px 0;">Select a track to see details.</div>
      </aside>
    </div>
  </section>
</main>

</div>
