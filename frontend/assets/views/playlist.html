<div class="Page PagePlaylistDetail">
  <main class="shell">
    <section class="playlistHero" style="display:flex; gap:22px; align-items:center; margin-top:10px;">
      <div class="playlistCover" id="plCover" style="width:320px; height:320px; border-radius:16px; background:#222; background-size:cover; background-position:center;"></div>
      <div style="flex:1; min-width:0;">
        <div class="muted" id="plOwner">Playlist</div>
        <h1 id="plTitle" style="margin:6px 0 8px 0;">Playlist</h1>
        <div class="muted" id="plCount">0 songs</div>
        <div style="margin-top:16px; display:flex; gap:10px;">
          <button class="primaryBtn" id="plPlayBtn" type="button">Play</button>
          <button class="btn" id="plShuffleBtn" type="button">Shuffle</button>
          <button class="btn" id="plBackBtn" type="button">Back</button>
        </div>
        <div class="muted" id="plDetailStatus" style="margin-top:10px;"></div>
      </div>
    </section>

    <section style="margin-top:18px;">
      <div class="hxField">
        <div class="muted" style="margin-bottom:6px;">Find a song to add</div>
        <div style="display:flex; gap:10px; align-items:center;">
          <input class="input" id="plAddSearch" type="text" placeholder="Search YouTube Music" style="flex:1;" />
          <button class="btn" id="plAddClear" type="button">Clear</button>
        </div>
      </div>
      <div id="plSearchResults" style="margin-top:10px;"></div>
    </section>

    <section style="margin-top:22px;">
      <div class="pageHeader" style="display:flex; align-items:flex-end; justify-content:space-between;">
        <h2 style="margin:0;">Tracks</h2>
        <div class="muted" id="plTracksHint"></div>
      </div>
      <div class="list" id="plTracks"></div>
    </section>
  </main>
</div>
