<div class="Page PageNowPlaying">

  <main class="shell shellNowPlaying">

    <!-- Station view (shown only when playing a station) -->
    <div id="npStationShell" class="shellNowPlayingV2" style="display:none;">
      <section class="npPanel npNow">
        <div class="npNowArtWrap">
          <img id="npNowImg" class="npNowImg" alt="Now playing cover" loading="lazy" />
        </div>
        <div class="npNowMeta">
          <div class="npNowTitle" id="npNowTitle">—</div>
          <div class="npNowArtist" id="npNowArtist">—</div>

          <div id="npNowStation" class="npNowStation" style="display:none;">
            <div class="npNowStationLabel muted">Listening to station</div>
            <div class="npNowStationName" id="npNowStationName">—</div>
            <div class="npNowStationSeed muted" id="npNowStationSeed">—</div>
            <div class="npNowStationMeta muted" id="npNowStationMeta"></div>
            <div class="npNowStationActions">
              <button id="npStationHistoryBtn" class="btn" type="button">Play history</button>
            </div>
          </div>
        </div>
      </section>


      <div id="npStationHistoryModal" class="hxModalOverlay" style="display:none;">
        <div class="hxModal" role="dialog" aria-modal="true" aria-label="Station play history">
          <div class="hxModalHeader">
            <div>
              <div class="hxModalTitle">Station play history</div>
              <div class="muted" id="npStationHistorySub">—</div>
            </div>
            <button class="btn" type="button" id="npStationHistoryClose">Close</button>
          </div>

          <div class="hxModalBody">
            <div class="npStationHistoryList" id="npStationHistoryList"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Queue/Playlist view (shown when NOT playing a station) -->
    <div id="npQueueShell" class="shellPlaylistNow" style="display:none;">
      <section class="pqLeft">
        <div class="pqHeader">
          <div class="pqTitle" id="pqTitle">Queue</div>
          <div class="muted pqSub" id="pqSub">—</div>
        </div>
        <div id="pqList" class="pqList"></div>
      </section>

      <section class="pqRight">
        <div class="pqArtWrap">
          <img id="pqNowImg" class="pqNowImg" alt="Now playing cover" loading="lazy" />
        </div>
        <div class="pqMeta">
          <div class="pqNowTitle" id="pqNowTitle">—</div>
          <div class="pqNowArtist muted" id="pqNowArtist">—</div>
        </div>
      </section>
    </div>

  </main>

</div>
