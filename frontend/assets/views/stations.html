<div class="Page PageStations">
<main class="shell">
    <!-- Force vertical layout regardless of global CSS -->
    <div id="stationsPageStack" style="display:flex; flex-direction:column; gap:18px; width:100%;">

      <section class="pageHeader" style="width:100%; display:block;">
        <h1>Stations</h1>
        <div class="muted">Your stations are personal and evolve as you like/dislike and skip.</div>
      </section>

<!-- CREATE STATION -->
<section class="card" style="padding:18px; width:100%; display:block;">

  <!-- ROW 1 -->
  <div style="display:flex; gap:16px; flex-wrap:wrap;">

    <div style="flex:0 0 220px; min-width:200px;">
      <div class="muted" style="margin-bottom:6px;">Seed type</div>
      <select id="stSeedType" class="input" style="width:100%;">
        <option value="artist">Artist</option>
        <option value="track">Track</option>
      </select>
    </div>

    <div style="flex:1 1 400px; min-width:260px;">
      <div class="muted" style="margin-bottom:6px;">Station name</div>
      <input
        id="stName"
        class="input"
        type="text"
        placeholder="e.g., Indie Rock Radio"
        style="width:100%;"
      />
    </div>

  </div>

  <!-- ROW 2 -->
  <div style="margin-top:16px;">
    <div class="muted" style="margin-bottom:6px;">Seed artist</div>
    <input
      id="stArtist"
      class="input"
      type="text"
      placeholder="e.g., Lord Huron"
      style="width:100%;"
    />
  </div>

  <!-- Track title (only visible when seed type = track) -->
  <div id="stTitleWrap" style="margin-top:16px; display:none;">
    <div class="muted" style="margin-bottom:6px;">Seed track title</div>
    <input
      id="stTitle"
      class="input"
      type="text"
      placeholder="e.g., Bag of Bones"
      style="width:100%;"
    />
  </div>

  <!-- Buttons -->
  <div style="margin-top:18px; display:flex; gap:12px; justify-content:flex-end;">
    <button id="stUseNow" class="btn" type="button">
      Use now playing
    </button>
    <button id="stCreate" class="primaryBtn" type="button">
      Create
    </button>
  </div>

  <div id="stCreateStatus" class="muted" style="margin-top:10px;"></div>
</section>

      <!-- YOUR STATIONS (now guaranteed below creation UI) -->
      <section id="yourStationsSection" style="width:100%; display:block;">
        <h2 style="margin:0 0 12px;">Your Stations</h2>
        <div id="stationsList" class="stationGrid"></div>
      </section>

    </div>
  </main>

</div>
