<div class="Page PageAdmin">
<main class="settings-main">
    <section class="card">
      <h2>Global Settings</h2>
      <div style="padding: 14px;">
        <div id="settings-boxes">
        <div id="settings-container">
          <div id="subsonic-settings">
            <div class="field col-8">
              <label for="subsonicBaseUrl">Subsonic / Navidrome Base URL</label>
              <input id="subsonicBaseUrl" type="text" placeholder="http://navidrome:4533" />
            </div>
            <div class="field col-4">
              <label for="subsonicUsername">Username</label>
              <input id="subsonicUsername" type="text" placeholder="admin" />
            </div>
            <div class="field col-4">
              <label for="subsonicPassword">Password</label>
              <input id="subsonicPassword" type="password" placeholder="(leave blank to keep unchanged)" />
            </div>
          </div>
          <div class="field col-4">
            <label for="playerMaxQueueItems">Max Queue Items</label>
            <input id="playerMaxQueueItems" type="number" min="1" step="1" />
            <div class="muted">Maximum size of the playback queue stored per session.</div>
          </div>

          <div class="field col-4">
            <label for="searchDefaultCountry">Default Country</label>
            <input id="searchDefaultCountry" type="text" placeholder="US" />
          </div>
          <div id="ungrouped-settings">
            <div class="field col-4">
              <label class="muted"><input id="searchHideNonOfficial" type="checkbox" /> Hide non-official results</label>
            </div>
            <div class="field col-4">
              <label class="muted"><input id="searchPreferOriginal" type="checkbox" /> Prefer original releases</label>
            </div>
            <div class="field col-4">
              <label class="muted"><input id="searchHideTracksWithoutArt" type="checkbox" /> Hide tracks without art</label>
            </div>
            <div class="field col-4">
              <label for="searchCacheTtlSeconds">Search Cache TTL (seconds)</label>
              <input id="searchCacheTtlSeconds" type="number" min="0" step="1" />
            </div>
          </div>
          <div id="musicbrainz-settings">
            <div class="field col-4">
              <label for="musicbrainzMinIntervalMs">MusicBrainz Min Interval (ms)</label>
              <input id="musicbrainzMinIntervalMs" type="number" min="0" step="1" />
            </div>
            <div class="field col-8">
              <label for="musicbrainzUserAgent">MusicBrainz User-Agent</label>
              <input id="musicbrainzUserAgent" type="text" placeholder="Helix/0.1 (you@example.com)" />
              <div class="muted">MusicBrainz requires a descriptive User-Agent. Include contact info if possible.</div>
            </div>
          </div>
          <div class="row" style="margin-top:10px;">
            <button id="saveSettingsBtn" class="primary">Save settings</button>
            <span class="status" id="settingsStatus"></span>
          </div>
        </div>
          <section class="card">
            <h2>Create User</h2>
            <div class="cardBody">
              <div class="muted" style="margin-bottom:12px;">Create a new Helix account. Password must be at least 8 characters.</div>
              <div class="row" style="align-items:flex-end; gap:12px; flex-wrap:wrap;">
                <div class="field" style="min-width:220px; flex:1 1 220px;">
                  <label for="newUserName">Username</label>
                  <input id="newUserName" type="text" placeholder="username" autocomplete="off" />
                </div>
                <div class="field" style="min-width:260px; flex:1 1 260px;">
                  <label for="newUserPass">Password</label>
            <input id="newUserPass" type="password" placeholder="password (min 8)" autocomplete="new-password" />
          </div>
          <div class="field" style="min-width:160px; flex:0 0 160px;">
            <label for="newUserRole">Role</label>
            <select id="newUserRole">
              <option value="user" selected>user</option>
              <option value="admin">admin</option>
            </select>
          </div>
          <button id="createUserBtn" class="primary" type="button">Create user</button>
        </div>
        <div class="status" id="createStatus" style="margin-top:10px;"></div>
      </div>
    </section>
  </div>
  <section class="userTable card">
    <h2>Users</h2>
    <div>
      <div id="userTableWrap" style="overflow:auto;"></div>
      <div id="userList" class="status"></div>
    </div>
  </section>
  </main>
</div>
