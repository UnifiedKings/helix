services:
  helix:
    container_name: helix
    build: .
    ports:
      - "10011:8000"
    restart: unless-stopped

    volumes:
      # Helix persisted data: db, logs, stream cache, etc.
      - ./data:/data

      # Static frontend served by backend
      - ./frontend:/app/static

      # Inbound YouTube/YTMusic download staging
      - ./inbound_yt:/inbound_yt

      # Music library root used by Navidrome/Subsonic/beets (not required)
      - /path/to/music:/data/music

      # Beets config
      - ./beets_config:/data/helix/beets

      # Folder for adding customs stations (disabled by default)
      - ./custom_stations:/data/plugins/stations

    environment:
      LISTENBRAINZ_TOKEN: insert-listenbrainz-token-here

      # Station / queue prefetch
      HELIX_PREFETCH_AHEAD: 3

      # Max tracks added when someone pastes a YT playlist/album link into a lobby
      HELIX_LOBBY_YT_LINK_MAX_ITEMS: 100

      # Optional DB watchdog tuning
      HELIX_DB_WATCHDOG_WARN_S: 2
      HELIX_DB_WATCHDOG_ERROR_S: 10
      # Set this to true to enable custom stations. Note this effectively allows plugins to run code
      # on your machine. Make sure you trust the code you are using for this.
      HELIX_ENABLE_CUSTOM_STATION_TYPES: false