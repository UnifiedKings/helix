services:
  helix:
    image: ghcr.io/unifiedkings/helix:latest
    container_name: helix
    ports:
      - "10011:8000"
    restart: unless-stopped

    volumes:
      # Helix persisted data: database, logs, stream cache, station covers, etc.
      - ./data:/data

      # Fulfillment staging
      - ./inbound_yt:/inbound_yt

      # Optional: music library root used by Navidrome/Subsonic/beets.
      - /path/to/music:/data/music

      # Beets config used by Helix fulfillment/import.
      - ./beets_config:/data/helix/beets

      # Optional custom station providers. Disabled by default.
      - ./custom_stations:/data/plugins/stations

    environment:
      LISTENBRAINZ_TOKEN: "${LISTENBRAINZ_TOKEN:-}"

      SUBSONIC_BASE_URL: "${SUBSONIC_BASE_URL:-}"
      SUBSONIC_USERNAME: "${SUBSONIC_USERNAME:-}"
      SUBSONIC_PASSWORD: "${SUBSONIC_PASSWORD:-}"

      HELIX_PREFETCH_AHEAD: "${HELIX_PREFETCH_AHEAD:-3}"
      HELIX_LOBBY_YT_LINK_MAX_ITEMS: "${HELIX_LOBBY_YT_LINK_MAX_ITEMS:-100}"

      HELIX_ENABLE_API_DOCS: "${HELIX_ENABLE_API_DOCS:-false}"
      HELIX_ALLOW_NON_ADMIN_IMPORT: "${HELIX_ALLOW_NON_ADMIN_IMPORT:-false}"

      # Optional OpenID Connect / Authentik login.
      HELIX_OIDC_ENABLED: "${HELIX_OIDC_ENABLED:-false}"
      HELIX_OIDC_DISPLAY_NAME: "${HELIX_OIDC_DISPLAY_NAME:-Authentik}"
      HELIX_OIDC_ISSUER: "${HELIX_OIDC_ISSUER:-}"
      HELIX_OIDC_CLIENT_ID: "${HELIX_OIDC_CLIENT_ID:-}"
      HELIX_OIDC_CLIENT_SECRET: "${HELIX_OIDC_CLIENT_SECRET:-}"
      HELIX_OIDC_REDIRECT_URI: "${HELIX_OIDC_REDIRECT_URI:-}"
      HELIX_OIDC_SCOPES: "${HELIX_OIDC_SCOPES:-openid profile email}"
      HELIX_OIDC_USERNAME_CLAIM: "${HELIX_OIDC_USERNAME_CLAIM:-preferred_username}"
      HELIX_OIDC_GROUPS_CLAIM: "${HELIX_OIDC_GROUPS_CLAIM:-groups}"
      HELIX_OIDC_AUTO_CREATE_USERS: "${HELIX_OIDC_AUTO_CREATE_USERS:-true}"
      HELIX_OIDC_ALLOW_FIRST_USER_ADMIN: "${HELIX_OIDC_ALLOW_FIRST_USER_ADMIN:-false}"
      HELIX_OIDC_AUTO_LINK_BY_USERNAME: "${HELIX_OIDC_AUTO_LINK_BY_USERNAME:-false}"
      HELIX_OIDC_ADMIN_GROUP: "${HELIX_OIDC_ADMIN_GROUP:-}"
      HELIX_OIDC_SYNC_ROLES: "${HELIX_OIDC_SYNC_ROLES:-false}"


      # Optional random Unsplash login backgrounds.
      HELIX_LOGIN_BACKGROUND_UNSPLASH_ENABLED: "${HELIX_LOGIN_BACKGROUND_UNSPLASH_ENABLED:-false}"
      HELIX_UNSPLASH_ACCESS_KEY: "${HELIX_UNSPLASH_ACCESS_KEY:-}"
      HELIX_LOGIN_BACKGROUND_UNSPLASH_QUERY: "${HELIX_LOGIN_BACKGROUND_UNSPLASH_QUERY:-vinyl record player turntable music}"
      HELIX_LOGIN_BACKGROUND_UNSPLASH_CACHE_SECONDS: "${HELIX_LOGIN_BACKGROUND_UNSPLASH_CACHE_SECONDS:-900}"

      HELIX_ENABLE_CUSTOM_STATION_TYPES: "${HELIX_ENABLE_CUSTOM_STATION_TYPES:-false}"
      HELIX_CUSTOM_STATION_TYPES_DIR: "${HELIX_CUSTOM_STATION_TYPES_DIR:-/data/plugins/stations}"

      HELIX_DB_WATCHDOG_WARN_S: "${HELIX_DB_WATCHDOG_WARN_S:-2}"
      HELIX_DB_WATCHDOG_ERROR_S: "${HELIX_DB_WATCHDOG_ERROR_S:-10}"

      # Keep yt-dlp current independently of the Helix image.
      # If an update check/install fails, Helix starts with the bundled version.
      HELIX_YTDLP_AUTO_UPDATE: "${HELIX_YTDLP_AUTO_UPDATE:-true}"
      HELIX_YTDLP_CHANNEL: "${HELIX_YTDLP_CHANNEL:-stable}"
      # Make this false if you are using helix over an http connection
      HELIX_COOKIE_SECURE: "${HELIX_COOKIE_SECURE:-true}"
